<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loomex Human Input</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 0;
        color: light-dark(#16161d, #f7f7fb);
        background: light-dark(#f7f8fb, #14151a);
      }
      main { width: 100%; max-width: 824px; margin: 0 auto; padding: 64px 72px 80px; }
      @media (max-width: 560px) {
        main { padding: 40px 32px 48px; }
      }
      .eyebrow {
        margin: 0 0 8px;
        color: #14b8a6;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: .08em;
        text-transform: uppercase;
      }
      h1 { margin: 0 0 8px; font-size: 24px; line-height: 1.18; }
      .summary { margin: 0 0 22px; color: light-dark(#656676, #aaaab5); line-height: 1.5; }
      form { display: grid; gap: 16px; }
      textarea, input[type="text"] {
        width: 100%;
        border: 1px solid light-dark(#d8dbe5, #3a3c47);
        border-radius: 10px;
        padding: 11px 12px;
        color: inherit;
        background: light-dark(#fff, #20222a);
        font: inherit;
        outline: none;
      }
      textarea { min-height: 130px; resize: vertical; }
      textarea:focus, input[type="text"]:focus {
        border-color: #14b8a6;
        box-shadow: 0 0 0 3px color-mix(in srgb, #14b8a6 18%, transparent);
      }
      .option {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        border: 1px solid light-dark(#dfe2ea, #343743);
        border-radius: 11px;
        padding: 12px;
        background: light-dark(#fff, #1d1f27);
        cursor: pointer;
      }
      .option input { margin-top: 3px; }
      .option span { line-height: 1.4; }
      .question-card {
        border: 1px solid light-dark(#dfe2ea, #343743);
        border-radius: 14px;
        padding: 16px;
        background: light-dark(#fff, #1a1c23);
      }
      .question-head { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 13px; }
      .question-number {
        display: grid;
        flex: 0 0 28px;
        height: 28px;
        place-items: center;
        border-radius: 999px;
        color: #8b5cf6;
        background: color-mix(in srgb, #8b5cf6 14%, transparent);
        font-size: 12px;
        font-weight: 800;
      }
      .question-title { margin: 3px 0 0; font-size: 15px; line-height: 1.4; }
      .question-controls { display: grid; gap: 10px; }
      .progress { margin: 0 0 14px; color: light-dark(#777989, #9b9daa); font-size: 12px; }
      .review-list { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
      .review-item { border: 1px solid light-dark(#dfe2ea, #343743); border-radius: 11px; padding: 12px; background: light-dark(#fff, #1d1f27); }
      .review-question { display: block; margin-bottom: 5px; color: light-dark(#5e6070, #a9aab5); font-size: 12px; }
      .review-answer { display: block; line-height: 1.45; }
      .actions { display: flex; justify-content: space-between; gap: 10px; padding-top: 4px; }
      button {
        border: 0;
        border-radius: 10px;
        padding: 11px 17px;
        color: #08110f;
        background: #14f1d6;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
      button.secondary { color: inherit; background: light-dark(#e9ebf2, #30333d); }
      button:disabled { cursor: progress; opacity: .65; }
      .status {
        display: none;
        margin-top: 16px;
        border: 1px solid light-dark(#bfe8cc, #2b6540);
        border-radius: 11px;
        padding: 13px;
        color: light-dark(#176b35, #8be1a7);
        background: light-dark(#edf9f1, #15281c);
      }
      .status.error {
        border-color: light-dark(#efc2c2, #713434);
        color: light-dark(#a02828, #ffaaaa);
        background: light-dark(#fff0f0, #2d1717);
      }
      .hidden { display: none; }
      .submitted .actions { display: none; }
      .auth-shell {
        max-width: 520px;
        margin: 18px auto 0;
        padding: 30px;
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 24px;
        background: linear-gradient(145deg, rgba(21,31,48,.88), rgba(8,13,24,.94));
        box-shadow: 0 24px 70px rgba(0,0,0,.32), 0 0 48px rgba(20,241,214,.08);
        backdrop-filter: blur(18px);
      }
      .auth-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
      .auth-brand img { width: 30px; height: 30px; object-fit: contain; }
      .auth-brand strong { letter-spacing: .03em; }
      .auth-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 20px; padding: 4px; border-radius: 12px; background: rgba(255,255,255,.06); }
      .auth-tabs button { padding: 9px 12px; color: #aeb8ca; background: transparent; }
      .auth-tabs button.active { color: #061311; background: #14f1d6; }
      .auth-field { display: grid; gap: 7px; }
      .auth-field label { color: #b8c4d6; font-size: 12px; font-weight: 750; }
      .auth-field input { width: 100%; border: 1px solid rgba(255,255,255,.14); border-radius: 11px; padding: 12px 13px; color: #f7f7fb; background: rgba(255,255,255,.06); font: inherit; outline: none; }
      .auth-field input:focus { border-color: #14f1d6; box-shadow: 0 0 0 3px rgba(20,241,214,.14); }
      .auth-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .auth-link { padding: 0; color: #6ff8e4; background: transparent; font-size: 12px; font-weight: 700; }
      .auth-submit { width: 100%; margin-top: 4px; }
      .auth-actions { display: grid; gap: 12px; margin-top: 20px; }
      .auth-otp { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; }
      .auth-otp input { min-width: 0; padding: 12px 0; text-align: center; font-size: 18px; font-weight: 850; }
      .auth-meta { margin: 0; color: #98a7bc; font-size: 12px; line-height: 1.45; }
      .auth-clear-note { color: #7e8ca1; font-size: 11px; text-align: center; }
      .auth-error { border-color: #713434; color: #ffaaaa; background: #2d1717; }
      @media (max-width: 560px) { .auth-shell { padding: 22px; } .auth-grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Loomex human input</p>
      <h1 id="title">Human input required</h1>
      <p id="summary" class="summary"></p>
      <form id="form"></form>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </main>

    <script>
      const form = document.querySelector("#form");
      const main = document.querySelector("main");
      const statusEl = document.querySelector("#status");
      let humanRequest = null;
      let questions = [];
      let answers = [];
      let currentIndex = 0;
      let showingReview = false;
      let activeRequestId = null;
      let activeStateScope = "";
      let submissionSucceeded = false;
      let authState = { mode: "login", challenge: null, email: "", busy: false, expired: false };
      let authExpiryTimer = null;
      let authResendTimer = null;
      const HUMAN_STATE_PREFIX = "loomex-human-input";

      function structuredData(value) {
        const structured = value?.structuredContent ?? value;
        return structured?.data ?? structured ?? {};
      }

      function toolOutput() {
        return window.openai?.toolOutput || {};
      }

      function normalizeRequest(output) {
        const data = structuredData(output);
        if (data.humanRequest || data.request) return data.humanRequest || data.request;
        if (Array.isArray(data.humanRequests)) {
          return data.humanRequests.find((request) => request?.status === "pending") || data.humanRequests[0] || data;
        }
        return data;
      }

      function envelopeRequestId(output) {
        const structured = output?.structuredContent ?? output;
        return String(structured?.meta?.requestId || "").trim();
      }

      function stateKey(requestId) {
        return activeStateScope && requestId
          ? `${HUMAN_STATE_PREFIX}:${activeStateScope}:${requestId}`
          : null;
      }

      function widgetSavedState(requestId) {
        const widgetState = window.openai?.widgetState;
        const candidate = widgetState?.privateContent?.loomexHumanInput
          || widgetState?.loomexHumanInput
          || widgetState;
        if (candidate?.requests && typeof candidate.requests === "object") {
          return candidate.requests[requestId] || null;
        }
        return candidate?.requestId === requestId ? candidate : null;
      }

      function readSavedState(requestId) {
        try {
          const widgetState = widgetSavedState(requestId);
          if (widgetState) return widgetState;
          const scopedKey = stateKey(requestId);
          const scopedRaw = scopedKey ? window.localStorage?.getItem(scopedKey) : null;
          if (scopedRaw) return JSON.parse(scopedRaw);
        } catch {
          return null;
        }
        return null;
      }

      function saveState(syncWidget = true) {
        if (!activeRequestId) return;
        const state = {
          version: 2,
          requestId: activeRequestId,
          answers,
          currentIndex,
          showingReview,
          submissionSucceeded,
        };
        try {
          const key = stateKey(activeRequestId);
          if (key) window.localStorage?.setItem(key, JSON.stringify(state));
        } catch {}
        if (!syncWidget) return;
        try {
          const widgetState = window.openai?.widgetState;
          const current = widgetState?.privateContent?.loomexHumanInput
            || widgetState?.loomexHumanInput;
          const requests = current?.requests && typeof current.requests === "object"
            ? { ...current.requests }
            : {};
          requests[activeRequestId] = state;
          const privateContent = widgetState?.privateContent
            && typeof widgetState.privateContent === "object"
            ? { ...widgetState.privateContent }
            : {};
          privateContent.loomexHumanInput = { version: 2, requests };
          window.openai?.setWidgetState?.({
            privateContent,
          });
        } catch {}
      }

      function storedAnswers(request) {
        const answer = request?.answer;
        if (!answer || typeof answer !== "object") return null;
        if (Array.isArray(answer.answers)) return answer.answers;
        return [answer];
      }

      function spec() {
        return humanRequest?.inputSpec || {};
      }

      function normalizeInputType(value) {
        const raw = String(value || "text").trim().toLowerCase().replace(/-/g, "_");
        if (raw === "true_false" || raw === "bool") return "boolean";
        if (raw === "radio") return "single_select";
        if (raw === "checkbox") return "multi_select";
        return ["multi_select", "single_select", "text", "boolean"].includes(raw) ? raw : "text";
      }

      function inputType() {
        return normalizeInputType(spec().inputType);
      }

      function isBatch() {
        return spec().collectionMode === "batch" || Array.isArray(spec().questions);
      }

      function requiresReview() {
        return questions.length > 1;
      }

      function questionList() {
        return isBatch() ? (spec().questions || []) : [spec()];
      }

      function questionId(question, index) {
        return String(question?.id ?? question?.questionId ?? question?.question_id ?? `question_${index + 1}`);
      }

      function questionType(question) {
        return normalizeInputType(
          question?.inputType ?? question?.input_type ?? question?.type ?? question?.kind ?? spec().inputType,
        );
      }

      function questionPrompt(question, index) {
        return question?.question ?? question?.questionText ?? question?.question_text ?? question?.text ?? `Question ${index + 1}`;
      }

      function questionOptionList(question) {
        return question?.options ?? question?.choices ?? question?.values ?? [];
      }

      function questionAllowsOther(question) {
        return question?.allowOther ?? question?.allow_other ?? true;
      }

      function questionOtherLabel(question) {
        return question?.otherLabel ?? question?.other_label ?? "Other";
      }

      function normalizedOption(option, index) {
        if (typeof option === "string" || typeof option === "number") {
          return { id: String(option), label: String(option) };
        }
        const id = option?.id ?? option?.value ?? option?.key ?? `option_${index + 1}`;
        const label = option?.label ?? option?.title ?? option?.name ?? option?.value ?? id;
        return { id: String(id), label: String(label) };
      }

      function normalizedOptions(question) {
        return questionOptionList(question).map(normalizedOption);
      }

      function setStatus(message, error = false) {
        statusEl.textContent = message;
        statusEl.className = error ? "status error" : "status";
        statusEl.style.display = "block";
      }

      // Secure authentication form: sensitive authentication values stay in memory only.
      function authPayload(output) {
        const data = structuredData(output);
        return data?.authForm ? data : null;
      }

      function authEnvelopeData(result) {
        const structured = result?.structuredContent ?? result ?? {};
        if (structured.ok === false) {
          const error = new Error(structured.error?.message || "Authentication request failed.");
          error.code = String(structured.error?.code || "AUTHENTICATION_FAILED");
          throw error;
        }
        if (structured.isError === true || result?.isError === true) {
          const error = new Error(structured.error?.message || result?.error?.message || "Authentication request failed.");
          error.code = String(structured.error?.code || result?.error?.code || "AUTHENTICATION_FAILED");
          throw error;
        }
        return structured.data ?? structured;
      }

      function authChallenge(data) {
        const challenge = data?.challenge;
        return challenge && typeof challenge === "object" ? challenge : null;
      }

      function clearAuthTimers() {
        if (authExpiryTimer) window.clearInterval(authExpiryTimer);
        if (authResendTimer) window.clearInterval(authResendTimer);
        authExpiryTimer = null;
        authResendTimer = null;
      }

      function clearAuthFields() {
        form.querySelectorAll("input").forEach((input) => { input.value = ""; });
      }

      function clearSensitiveAuthFields() {
        form.querySelectorAll("#auth-password, #auth-confirm-password, .auth-otp input").forEach((input) => { input.value = ""; });
      }

      function resetAuthState(mode = "login", email = "") {
        clearAuthTimers();
        clearSensitiveAuthFields();
        authState = { mode, challenge: null, email, busy: false, expired: false };
      }

      function authTimestamp(value) {
        const timestamp = Date.parse(String(value || ""));
        return Number.isFinite(timestamp) ? timestamp : null;
      }

      function authCooldownRemaining(challenge = authState.challenge) {
        const availableAt = authTimestamp(challenge?.resendAvailableAt);
        return availableAt === null ? 0 : Math.max(0, availableAt - Date.now());
      }

      function authExpiryRemaining(challenge = authState.challenge) {
        const expiresAt = authTimestamp(challenge?.expiresAt);
        return expiresAt === null ? null : Math.max(0, expiresAt - Date.now());
      }

      function formatAuthDuration(milliseconds) {
        const seconds = Math.ceil(Math.max(0, milliseconds) / 1000);
        return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
      }

      function authErrorMessage(error) {
        const code = String(error?.code || "").toUpperCase();
        if (code.includes("OTP_INVALID") || code.includes("CODE_INVALID")) return "That verification code is invalid. Check the email and try again.";
        if (code.includes("OTP_EXPIRED") || code.includes("CHALLENGE_EXPIRED") || code.includes("CODE_EXPIRED")) return "That verification code has expired. Request a new code.";
        if (code.includes("OTP_REPLAY") || code.includes("OTP_ALREADY") || code.includes("OTP_NOT_PENDING") || code.includes("CODE_REPLAY")) return "That verification code was already used. Start a new verification request.";
        if (code.includes("VALIDATION") || code.includes("PASSWORD_MISMATCH") || code.includes("EMAIL_INVALID")) return "Check the entered details and try again.";
        if (code.includes("RATE_LIMIT") || code.includes("TOO_MANY") || code.includes("OTP_ATTEMPTS_EXCEEDED")) return "Too many attempts. Wait for the cooldown before requesting another code.";
        return error instanceof Error ? error.message : "Authentication failed. Try again.";
      }

      function scheduleAuthTimers() {
        clearAuthTimers();
        const challenge = authState.challenge;
        if (!challenge) return;
        const tick = () => {
          const meta = form.querySelector("#auth-expiry-meta");
          const remaining = authExpiryRemaining(challenge);
          if (remaining !== null) {
            if (remaining <= 0) {
              authState.expired = true;
              authState.busy = false;
              clearSensitiveAuthFields();
              if (meta) meta.textContent = "Code expired. Request a new code.";
              const submit = form.querySelector("#auth-submit");
              if (submit) submit.disabled = true;
              setStatus("The verification code expired. Request a new code.", true);
              if (authExpiryTimer) window.clearInterval(authExpiryTimer);
              authExpiryTimer = null;
              return;
            }
            if (meta) meta.textContent = `Code expires in ${formatAuthDuration(remaining)}.`;
          }
          const resend = form.querySelector("#auth-resend");
          const cooldown = authCooldownRemaining(challenge);
          if (resend) {
            resend.disabled = cooldown > 0 || authState.busy;
            resend.textContent = cooldown > 0 ? `Resend code in ${formatAuthDuration(cooldown)}` : "Resend code";
          }
          if (cooldown <= 0 && authResendTimer) {
            window.clearInterval(authResendTimer);
            authResendTimer = null;
          }
        };
        tick();
        if (authExpiryRemaining(challenge) !== null) authExpiryTimer = window.setInterval(tick, 1000);
        if (authCooldownRemaining(challenge) > 0) authResendTimer = window.setInterval(tick, 1000);
      }

      function authModeTransition(mode, message = null, error = false) {
        const email = authState.email;
        resetAuthState(mode, email);
        renderAuth({ authForm: { mode } }, message, error);
      }

      function clearAuthSession() {
        clearAuthTimers();
        clearAuthFields();
        authState = { mode: "login", challenge: null, email: "", busy: false, expired: false };
      }

      function authInput(id, label, type = "text", value = "", autocomplete = "off") {
        return `<div class="auth-field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${escapeHtml(value)}" autocomplete="${autocomplete}" required /></div>`;
      }

      function authOtpInputs() {
        return `<div class="auth-field"><label>Verification code</label><div class="auth-otp">${Array.from({ length: 6 }, (_, index) => `<input id="auth-code-${index}" type="text" inputmode="numeric" maxlength="1" autocomplete="${index === 0 ? "one-time-code" : "off"}" aria-label="Verification code digit ${index + 1}" />`).join("")}</div></div>`;
      }

      function authCode() {
        return [...form.querySelectorAll(".auth-otp input")].map((input) => input.value).join("");
      }

      function renderAuth(data, message = null, error = false) {
        const requestedMode = data?.authForm?.mode || authState.mode || "login";
        if (requestedMode !== authState.mode) clearSensitiveAuthFields();
        authState.mode = requestedMode;
        const challenge = authChallenge(data);
        if (challenge) {
          authState.challenge = challenge;
          authState.email = challenge.email || authState.email;
          authState.expired = false;
        }
        main.classList.remove("hidden");
        form.classList.remove("submitted");
        const mode = authState.mode;
        const isLogin = mode === "login" || mode === "register";
        const title = mode === "otp" ? "Verify your email" : mode === "forgot" ? "Reset your password" : mode === "reset" ? "Choose a new password" : mode === "register" ? "Create your workspace account" : "Welcome back";
        const subtitle = mode === "otp" ? `Enter the code sent to ${escapeHtml(authState.email)}.` : mode === "forgot" ? "We will send a verification code to your email." : mode === "reset" ? `Use the code sent to ${escapeHtml(authState.email)}.` : "Sign in securely to continue to your Loomex workspace.";
        const formContent = mode === "otp"
          ? `${authOtpInputs()}<p id="auth-expiry-meta" class="auth-meta">${escapeHtml(challenge?.expiresAt ? "Checking code expiry..." : "Codes expire soon.")}</p><button id="auth-resend" class="secondary" type="button">Resend code</button>`
          : mode === "forgot"
            ? authInput("auth-email", "Email", "email", authState.email, "email")
            : mode === "reset"
              ? `${authOtpInputs()}${authInput("auth-password", "New password", "password", "", "new-password")}${authInput("auth-confirm-password", "Confirm new password", "password", "", "new-password")}<p id="auth-expiry-meta" class="auth-meta">${escapeHtml(challenge?.expiresAt ? "Checking code expiry..." : "Codes expire soon.")}</p><button id="auth-resend" class="secondary" type="button">Resend code</button>`
              : `${authInput("auth-email", "Email", "email", authState.email, "email")}${mode === "register" ? `<div class="auth-grid">${authInput("auth-first-name", "First name", "text", "", "given-name")}${authInput("auth-last-name", "Last name", "text", "", "family-name")}</div>` : ""}${authInput("auth-password", "Password", "password", "", "current-password")}${mode === "register" ? authInput("auth-confirm-password", "Confirm password", "password", "", "new-password") : ""}`;
        form.innerHTML = `<section class="auth-shell" aria-label="Secure Loomex authentication"><div class="auth-brand"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%2314f1d6' d='M4 7h24v4H4zm4 7h16v4H8zm4 7h8v4h-8z'/%3E%3C/svg%3E" alt="Loomex" /><strong>Loomex workspace</strong></div>${isLogin ? `<div class="auth-tabs"><button id="auth-login-tab" type="button" class="${mode === "login" ? "active" : ""}">Sign in</button><button id="auth-register-tab" type="button" class="${mode === "register" ? "active" : ""}">Create account</button></div>` : ""}<h1>${title}</h1><p class="summary">${subtitle}</p><div class="auth-actions">${formContent}<button id="auth-submit" class="auth-submit" type="submit">${mode === "otp" ? "Verify email" : mode === "forgot" ? "Send reset code" : mode === "reset" ? "Reset password" : mode === "register" ? "Create account" : "Sign in"}</button>${isLogin && mode === "login" ? `<button id="auth-forgot" class="auth-link" type="button">Forgot password?</button>` : ""}${!isLogin ? `<button id="auth-back" class="secondary" type="button">Back to sign in</button>` : ""}<span class="auth-clear-note">Passwords and codes stay in this secure form and are cleared after each attempt.</span></div></section>`;
        statusEl.style.display = "none";
        form.querySelector("#auth-login-tab")?.addEventListener("click", () => authModeTransition("login"));
        form.querySelector("#auth-register-tab")?.addEventListener("click", () => authModeTransition("register"));
        form.querySelector("#auth-forgot")?.addEventListener("click", () => authModeTransition("forgot"));
        form.querySelector("#auth-back")?.addEventListener("click", () => { resetAuthState("login"); renderAuth({ authForm: { mode: "login" } }); });
        form.querySelector("#auth-resend")?.addEventListener("click", () => void resendAuthCode());
        form.querySelectorAll(".auth-otp input").forEach((input, index, inputs) => input.addEventListener("input", () => { input.value = input.value.replace(/\D/g, "").slice(-1); inputs[index + 1]?.focus(); }));
        scheduleAuthTimers();
        if (message) setStatus(message, error);
      }

      async function resendAuthCode() {
        if (authState.busy) return;
        const cooldown = authCooldownRemaining();
        if (cooldown > 0) { setStatus(`Wait ${formatAuthDuration(cooldown)} before requesting another code.`, true); return; }
        if (authState.mode === "otp") {
          authModeTransition("register", "Enter your registration details again to request a new code.");
          return;
        }
        if (authState.mode !== "reset" || !authState.email || !window.openai?.callTool) return;
        authState.busy = true;
        clearSensitiveAuthFields();
        try {
          const result = await window.openai.callTool("loomex_auth_password_forgot", { email: authState.email });
          const data = authEnvelopeData(result);
          authState.busy = false;
          clearSensitiveAuthFields();
          renderAuth(data, "A new verification code was sent. Check your email.");
        } catch (error) {
          authState.busy = false;
          clearSensitiveAuthFields();
          renderAuth({ authForm: { mode: "reset" } }, authErrorMessage(error), true);
        }
      }

      function authRequestForForm() {
        const mode = authState.mode;
        if (mode === "otp") return { name: "loomex_auth_register_verify", arguments: { challengeId: authState.challenge?.challengeId, email: authState.email, code: authCode() } };
        if (mode === "forgot") return { name: "loomex_auth_password_forgot", arguments: { email: form.querySelector("#auth-email")?.value.trim() || "" } };
        if (mode === "reset") return { name: "loomex_auth_password_reset", arguments: { challengeId: authState.challenge?.challengeId, email: authState.email, code: authCode(), password: form.querySelector("#auth-password")?.value || "", confirmPassword: form.querySelector("#auth-confirm-password")?.value || "" } };
        return { name: "loomex_auth_login", arguments: { email: form.querySelector("#auth-email")?.value.trim() || "", ...(mode === "register" ? { firstName: form.querySelector("#auth-first-name")?.value.trim() || "", lastName: form.querySelector("#auth-last-name")?.value.trim() || "" } : {}), password: form.querySelector("#auth-password")?.value || "", ...(mode === "register" ? { confirmPassword: form.querySelector("#auth-confirm-password")?.value || "" } : {}) } };
      }

      async function submitAuthForm() {
        if (authState.busy || !window.openai?.callTool) return;
        if (authState.expired) { setStatus("The verification code expired. Request a new code.", true); return; }
        const request = authRequestForForm();
        if ((request.name === "loomex_auth_register_verify" || request.name === "loomex_auth_password_reset") && request.arguments.code.length !== 6) { setStatus("Enter the 6-digit verification code.", true); return; }
        if (request.name === "loomex_auth_password_reset" && request.arguments.password !== request.arguments.confirmPassword) { setStatus("Passwords do not match.", true); return; }
        if ((request.name === "loomex_auth_login" || request.name === "loomex_auth_password_forgot") && !request.arguments.email) { setStatus("Enter your email address.", true); return; }
        authState.busy = true;
        const button = form.querySelector("#auth-submit");
        if (button) { button.disabled = true; button.textContent = "Working..."; }
        const wasReset = request.name === "loomex_auth_password_reset";
        clearSensitiveAuthFields();
        try {
          const result = await window.openai.callTool(request.name, request.arguments);
          clearAuthFields();
          const data = authEnvelopeData(result);
          const authenticated = data.authenticated === true;
          const reset = wasReset && data.status === "password_reset";
          if (reset) {
            const email = authState.email;
            resetAuthState("login", email);
            renderAuth({ authForm: { mode: "login" } }, "Password reset. Sign in with your new password.");
          } else if (authenticated) {
            authState.busy = false;
            renderAuth(data, "Signed in. Continue with organization selection.");
            if (window.openai?.sendFollowUpMessage) await window.openai.sendFollowUpMessage({ prompt: "Workspace authentication succeeded. Continue immediately with the Loomex organization flow using the returned nextAction; do not ask for credentials again.", scrollToBottom: true });
          } else {
            authState.busy = false;
            renderAuth(data, data.pending ? "Verification code sent. Check your email." : null);
          }
        } catch (error) {
          clearAuthFields();
          authState.busy = false;
          const code = String(error?.code || "").toUpperCase();
          if (code.includes("OTP_EXPIRED") || code.includes("CHALLENGE_EXPIRED") || code.includes("CODE_EXPIRED")) authState.expired = true;
          if (code.includes("OTP_REPLAY") || code.includes("OTP_ALREADY") || code.includes("OTP_NOT_PENDING") || code.includes("CODE_REPLAY")) {
            authModeTransition("login", authErrorMessage(error), true);
          } else {
            renderAuth({ authForm: { mode: authState.mode } }, authErrorMessage(error), true);
          }
        }
      }

      async function requestSidePanel() {
        try {
          await window.openai?.requestDisplayMode?.({ mode: "fullscreen" });
        } catch {}
      }

      function render(output = toolOutput()) {
        const auth = authPayload(output);
        if (auth) {
          renderAuth(auth);
          return;
        }
        if (form.querySelector(".auth-shell")) clearAuthSession();
        const candidate = normalizeRequest(output);
        const nextRequest = candidate?.id ? candidate : humanRequest;
        const nextType = nextRequest?.inputSpec?.inputType;
        if (!nextRequest?.id || normalizeInputType(nextType) === "text") {
          main.classList.add("hidden");
          form.replaceChildren();
          return;
        }
        main.classList.remove("hidden");
        const nextScope = candidate?.id ? envelopeRequestId(output) : "";
        const requestChanged = activeRequestId !== nextRequest?.id
          || nextScope !== activeStateScope;
        if (requestChanged) {
          activeRequestId = nextRequest?.id || null;
          activeStateScope = nextScope;
          const saved = readSavedState(activeRequestId);
          answers = saved?.answers || [];
          currentIndex = Number.isInteger(saved?.currentIndex) ? saved.currentIndex : 0;
          showingReview = saved?.showingReview === true;
          submissionSucceeded = saved?.submissionSucceeded === true;
        }
        const previousAnswers = new Map(questions.map((question, index) => [questionId(question, index), answers[index]]));
        humanRequest = nextRequest;
        const currentSpec = spec();
        document.querySelector("#title").textContent =
          questionPrompt(currentSpec, 0) || humanRequest.title || "Human input required";
        document.querySelector("#summary").textContent =
          humanRequest.description || humanRequest.context?.summary || "";

        questions = questionList();
        const remoteAnswers = storedAnswers(humanRequest);
        answers = questions.map((question, index) => {
          const id = questionId(question, index);
          return previousAnswers.get(id)
            ?? answers[index]
            ?? remoteAnswers?.find((answer) => String(answer?.questionId ?? answer?.id ?? "") === id)
            ?? (remoteAnswers?.length === 1 && !isBatch() ? remoteAnswers[0] : null);
        });
        currentIndex = Math.min(currentIndex, Math.max(questions.length - 1, 0));
        const disabled = humanRequest.status === "resolved";
        if (disabled || submissionSucceeded || remoteAnswers) showingReview = true;
        form.classList.toggle("submitted", disabled || submissionSucceeded);
        renderStep(disabled);
      }

      function renderStep(disabled = false) {
        const singleQuestion = !requiresReview();
        const submitLabel = singleQuestion ? "Submit" : "Submit & Resume";
        const disabledAttr = disabled ? "disabled" : "";
        const formSubmitted = disabled || submissionSucceeded;
        const actions = formSubmitted ? "" : `<div class="actions">
          <button id="expand" class="secondary" type="button" ${disabledAttr}>Open in side panel</button>
          ${showingReview ? `<button id="back" class="secondary" type="button" ${disabledAttr}>Back</button><button id="submit" type="submit" ${disabledAttr}>${submitLabel}</button>` : singleQuestion ? `<span></span><button id="submit" type="submit" ${disabledAttr}>${submitLabel}</button>` : `${currentIndex > 0 ? `<button id="back" class="secondary" type="button" ${disabledAttr}>Back</button>` : `<span></span>`}<button id="next" type="button" ${disabledAttr}>${currentIndex === questions.length - 1 ? "Review answers" : "Next"}</button>`}
        </div>`;
        if (showingReview) {
          form.innerHTML = `<p class="progress">Review all answers before submitting.</p><section class="question-card"><ul class="review-list">${questions.map((question, index) => `<li class="review-item"><span class="review-question">${index + 1}. ${escapeHtml(questionPrompt(question, index))}</span><span class="review-answer">${escapeHtml(answerLabel(question, answers[index]))}</span></li>`).join("")}</ul></section>${actions}`;
        } else {
          const question = questions[currentIndex] || {};
          form.innerHTML = `<p class="progress">Question ${currentIndex + 1} of ${questions.length}</p><section class="question-card">
            <div class="question-head"><span class="question-number">${currentIndex + 1}</span><h2 class="question-title">${escapeHtml(questionPrompt(question, currentIndex))}</h2></div>
            <div class="question-controls">${questionControls(question, currentIndex, disabled)}</div>
          </section>${actions}`;
          restoreAnswer(question, currentIndex);
          form.querySelectorAll(`input[name="value-${currentIndex}"]`).forEach((input) => input.addEventListener("change", () => {
            updateOtherInput(question, currentIndex, disabled);
            saveDraft();
            saveState();
            if (!disabled && input.value !== "other") void advance();
          }));
          form.querySelector(`#otherText-${currentIndex}`)?.addEventListener("input", () => {
            saveDraft();
            saveState(false);
          });
          form.querySelector(`#otherText-${currentIndex}`)?.addEventListener("change", () => {
            saveDraft();
            saveState();
          });
          updateOtherInput(question, currentIndex, disabled);
          if (questions.length === 1 && questionType(question) === "text") {
            form.querySelector(`#answer-${currentIndex}`)?.addEventListener("keydown", (event) => {
              if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                form.requestSubmit();
              }
            });
          }
        }
        document.querySelector("#expand")?.addEventListener("click", () => void requestSidePanel());
        document.querySelector("#back")?.addEventListener("click", () => {
          if (showingReview) {
            showingReview = false;
            saveState();
            renderStep(disabled);
            return;
          }
          currentIndex = Math.max(0, currentIndex - 1);
          saveState();
          renderStep(disabled);
        });
        document.querySelector("#next")?.addEventListener("click", () => void advance());
      }

      function questionControls(question, index, disabled) {
        const type = questionType(question);
        const name = `value-${index}`;
        if (type === "text") {
          return `<textarea id="answer-${index}" required placeholder="Type your answer" ${disabled ? "disabled" : ""}></textarea>`;
        }
        if (type === "boolean") {
          return [
            optionHtml("true", "True", "radio", name, disabled),
            optionHtml("false", "False", "radio", name, disabled),
          ].join("");
        }
        const controls = [];
        const controlType = type === "multi_select" ? "checkbox" : "radio";
        for (const [optionIndex, option] of normalizedOptions(question).entries()) {
          controls.push(optionHtml(option.id, option.label, controlType, name, disabled, optionIndex));
        }
        if (questionAllowsOther(question) !== false) {
          controls.push(optionHtml("other", questionOtherLabel(question), controlType, name, disabled, normalizedOptions(question).length));
          controls.push(`<input id="otherText-${index}" type="text" placeholder="Type other answer" hidden ${disabled ? "disabled" : ""} />`);
        }
        return controls.join("");
      }

      function updateOtherInput(question, index, disabled) {
        const other = document.querySelector(`#otherText-${index}`);
        if (!other) return;
        const selected = [...document.querySelectorAll(`input[name="value-${index}"]:checked`)].some((input) => input.value === "other");
        other.hidden = !selected;
        other.style.display = selected ? "block" : "none";
        other.disabled = disabled || !selected;
        if (!selected) other.value = "";
      }

      function optionHtml(value, label, type, name, disabled, index = 0) {
        return `<label class="option">
          <input type="${type}" id="${name}-${index}" name="${name}" value="${escapeHtml(value)}" ${disabled ? "disabled" : ""} />
          <span>${escapeHtml(label)}</span>
        </label>`;
      }

      function restoreAnswer(question, index) {
        const answer = answers[index];
        if (!answer) return;
        const type = questionType(question);
        if (type === "text") document.querySelector(`#answer-${index}`).value = answer.value || "";
        const values = type === "multi_select" ? (answer.values || []) : [answer.value];
        values.filter((value) => value !== undefined).forEach((value) => {
          const input = [...document.querySelectorAll(`input[name="value-${index}"]`)].find((candidate) => candidate.value === String(value));
          if (input) input.checked = true;
        });
        const other = document.querySelector(`#otherText-${index}`);
        if (other) other.value = answer.otherText || "";
      }

      function escapeHtml(value) {
        return String(value || "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;",
        }[char]));
      }

      function answerPayload() {
        const answersPayload = questions.map((question, index) => ({
            questionId: questionId(question, index),
            inputType: questionType(question) === "multi_select" ? "checkbox" : questionType(question) === "single_select" ? "radio" : questionType(question),
            question: questionPrompt(question, index),
            ...(answers[index] || {}),
          }));
        if (!isBatch()) return answersPayload[0] || {};
        const payload = { answers: answersPayload };
        if (spec().schemaVersion) payload.schemaVersion = spec().schemaVersion;
        if (spec().collectionMode) payload.collectionMode = spec().collectionMode;
        return payload;
      }

      function answerLabel(question, answer) {
        if (!answer) return "Not answered";
        if (questionType(question) === "text") return answer.value || "—";
        const values = questionType(question) === "multi_select" ? (answer.values || []) : [answer.value];
        const labels = values.map((value) => normalizedOptions(question).find((option) => option.id === String(value))?.label || (value === "true" ? "True" : value === "false" ? "False" : value));
        if (answer.otherText) labels.push(`Other: ${answer.otherText}`);
        return labels.join(", ") || "—";
      }

      function captureCurrent() {
        answers[currentIndex] = answerForQuestion(questions[currentIndex], currentIndex);
        saveState();
      }

      function saveDraft() {
        const question = questions[currentIndex];
        if (!question) return;
        answers[currentIndex] = draftAnswerForQuestion(question, currentIndex);
      }

      async function advance() {
        try {
          captureCurrent();
          if (currentIndex < questions.length - 1) currentIndex += 1;
          else showingReview = true;
          saveState();
          renderStep(false);
        } catch (error) {
          setStatus(error instanceof Error ? error.message : "Please complete this question.", true);
        }
      }

      function answerForQuestion(question, index) {
        const type = questionType(question);
        const name = `value-${index}`;
        if (type === "text") {
          const value = document.querySelector(`#answer-${index}`)?.value.trim() || "";
          if (!value) throw new Error("Answer is required.");
          return { value };
        }
        if (type === "boolean") {
          const selected = document.querySelector(`input[name="${name}"]:checked`)?.value;
          if (selected === undefined) throw new Error("Select true or false.");
          return { value: selected === "true" };
        }
        const draft = draftAnswerForQuestion(question, index);
        const selected = type === "multi_select" ? draft.values : [draft.value];
        const otherText = draft.otherText || "";
        if (!selected.filter((value) => value !== undefined).length) throw new Error(type === "multi_select" ? "Select at least one option." : "Select one option.");
        if (selected.includes("other") && !otherText) throw new Error("Other option requires text.");
        return type === "multi_select" ? { values: selected, otherText } : { value: selected[0], otherText };
      }

      function draftAnswerForQuestion(question, index) {
        const type = questionType(question);
        const name = `value-${index}`;
        if (type === "text") {
          return { value: document.querySelector(`#answer-${index}`)?.value.trim() || "" };
        }
        if (type === "boolean") {
          const selected = document.querySelector(`input[name="${name}"]:checked`)?.value;
          return selected === undefined ? {} : { value: selected === "true" };
        }
        const selected = [...document.querySelectorAll(`input[name="${name}"]:checked`)].map((input) => input.value);
        const otherText = document.querySelector(`#otherText-${index}`)?.value.trim() || "";
        return type === "multi_select" ? { values: selected, otherText } : { value: selected[0], otherText };
      }

      render();

      window.addEventListener("openai:set_globals", (event) => {
        const output = event.detail?.globals?.toolOutput;
        render(output || toolOutput());
      });

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent || event.data?.jsonrpc !== "2.0") return;
        if (event.data?.method === "ui/notifications/tool-result") {
          render(event.data.params?.result || event.data.params || {});
        }
      });

      window.addEventListener("loomex:auth-logout", clearAuthSession);
      window.addEventListener("loomex:auth-cancel", clearAuthSession);

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (authPayload(toolOutput()) || form.querySelector(".auth-shell")) {
          await submitAuthForm();
          return;
        }
        statusEl.style.display = "none";
        if (!window.openai?.callTool) {
          setStatus("This host does not expose the app tool bridge.", true);
          return;
        }
        const submit = document.querySelector("#submit");
        submit.disabled = true;
        submit.textContent = "Submitting...";
        try {
          if (!showingReview) captureCurrent();
          const result = await window.openai.callTool("loomex_human_respond", {
            requestId: humanRequest.id,
            response: answerPayload(),
            idempotencyKey: `human-${humanRequest.id}-${Date.now()}`,
          });
          const output = result?.structuredContent || {};
          if (output.ok === false) throw new Error(output.error?.message || "Loomex rejected the answer.");
          form.querySelectorAll("button, input, textarea").forEach((element) => { element.disabled = true; });
          submissionSucceeded = true;
          form.classList.add("submitted");
          showingReview = true;
          saveState();
          renderStep(true);
          setStatus("Submitted. Continuing the workflow…");
          if (window.openai?.sendFollowUpMessage) {
            await window.openai.sendFollowUpMessage({
              prompt: "The non-text human input form was submitted successfully. Continue the Loomex workflow immediately using the resolved request, without asking the user to say continue or repeat the answer in chat, and report its next state.",
              scrollToBottom: true,
            });
          }
        } catch (error) {
          setStatus(error instanceof Error ? error.message : "Submit failed.", true);
        } finally {
          if (!submissionSucceeded) {
            submit.disabled = false;
            submit.textContent = "Submit & Resume";
          }
        }
      });
    </script>
  </body>
</html>
